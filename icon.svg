<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Tormenta Imperial</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23261C"/>
      <stop offset="1" stop-color="#0A0B07"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C468"/>
      <stop offset="0.5" stop-color="#C49629"/>
      <stop offset="1" stop-color="#7E5E15"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFF8DC"/>
      <stop offset="0.4" stop-color="#FFD933"/>
      <stop offset="1" stop-color="#D99612"/>
    </linearGradient>
    <!-- Stormy sky: light enough that the industry reads as silhouette -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A6250"/>
      <stop offset="0.45" stop-color="#3C432F"/>
      <stop offset="1" stop-color="#20261A"/>
    </linearGradient>
  </defs>

  <!-- Riveted plate -->
  <rect x="5" y="5" width="246" height="246" rx="36" fill="url(#plate)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="33" fill="none" stroke="url(#brass)" stroke-width="7"/>

  <!-- Sky -->
  <rect x="22" y="22" width="212" height="212" rx="22" fill="url(#sky)"/>

  <!-- Storm clouds, darker than the sky so they read -->
  <g fill="#262C1E" opacity="0.9">
    <ellipse cx="76" cy="52" rx="46" ry="18"/>
    <ellipse cx="132" cy="42" rx="54" ry="20"/>
    <ellipse cx="192" cy="54" rx="42" ry="16"/>
    <rect x="22" y="22" width="212" height="34"/>
  </g>
  <g fill="#323927" opacity="0.7">
    <ellipse cx="100" cy="74" rx="40" ry="13"/>
    <ellipse cx="176" cy="80" rx="34" ry="11"/>
  </g>

  <!-- Industrial skyline, near-black against the lit sky -->
  <g fill="#06070B">
    <!-- far stacks -->
    <rect x="38" y="126" width="17" height="96"/>
    <rect x="34" y="120" width="25" height="9" rx="2"/>
    <rect x="206" y="138" width="16" height="84"/>
    <rect x="202" y="132" width="24" height="9" rx="2"/>
    <!-- main stacks -->
    <path d="M66 222 L66 112 L72 102 L88 102 L94 112 L94 222 Z"/>
    <rect x="62" y="97" width="36" height="10" rx="2"/>
    <path d="M166 222 L166 124 L172 114 L186 114 L192 124 L192 222 Z"/>
    <rect x="162" y="109" width="34" height="10" rx="2"/>
    <!-- central keep -->
    <path d="M104 222 L104 140 L116 140 L116 120 L128 108 L140 120 L140 140 L154 140 L154 222 Z"/>
  </g>

  <!-- Brass banding on the keep + lit windows -->
  <g fill="#C49629">
    <rect x="104" y="158" width="50" height="6"/>
    <rect x="104" y="186" width="50" height="5" opacity="0.75"/>
  </g>
  <g fill="#FFD933" opacity="0.85">
    <rect x="72" y="140" width="6" height="8"/>
    <rect x="82" y="140" width="6" height="8"/>
    <rect x="172" y="150" width="6" height="8"/>
    <rect x="122" y="203" width="7" height="12"/>
    <rect x="134" y="203" width="7" height="12"/>
  </g>

  <!-- Ground -->
  <rect x="22" y="218" width="212" height="16" fill="#06070B"/>
  <rect x="22" y="215" width="212" height="4" fill="#8A6818"/>

  <!-- Lightning -->
  <path d="M154 30 L108 126 L136 126 L100 214 L180 104 L146 104 L178 30 Z" fill="url(#bolt)"/>
  <path d="M154 30 L108 126 L136 126 L100 214 L180 104 L146 104 L178 30 Z"
        fill="none" stroke="#FFFCEB" stroke-width="2.5" opacity="0.5"/>

  <!-- Corner rivets -->
  <g>
    <circle cx="34" cy="34" r="7.5" fill="#2E2A1D"/><circle cx="32.5" cy="32.5" r="3.6" fill="#E0BB60"/>
    <circle cx="222" cy="34" r="7.5" fill="#2E2A1D"/><circle cx="220.5" cy="32.5" r="3.6" fill="#E0BB60"/>
    <circle cx="34" cy="222" r="7.5" fill="#2E2A1D"/><circle cx="32.5" cy="220.5" r="3.6" fill="#E0BB60"/>
    <circle cx="222" cy="222" r="7.5" fill="#2E2A1D"/><circle cx="220.5" cy="220.5" r="3.6" fill="#E0BB60"/>
  </g>
</svg>
