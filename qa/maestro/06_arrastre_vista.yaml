# Bug de Bryan: "el arrastre solo se activa en algunos sitios".
#
# Rejilla 4x4 de puntos de partida sobre la vista del mapa (x 15/38/62/85 %,
# y 25/45/65/82 %). En cada punto: captura, arrastre de un dedo de 10 % del
# ancho (600 ms), captura, y arrastre de vuelta. Los pares <punto>_0 / <punto>_1
# se comparan con herramientas/analizar_arrastre.py, que escribe la tabla de
# cobertura (movio / no movio). Hoy no mueven los puntos que caen sobre la
# franja inferior de OnScreenControls (contenedores PASS) ni sobre los globos
# de ayuda y paneles del HUD.
# Esperado tras el arreglo: todos los puntos que no caen sobre un boton mueven.
appId: com.bryankey.tormentaimperial.qa
name: 06 Arrastre de un dedo por toda la pantalla
tags: [camara, arrastre]
---
- runFlow: comun/en_partida.yaml
# punto x=15% y=25%
- takeScreenshot: ${output.dir}/06_r0c0_x15y25_0
- swipe:
    start: "15%,25%"
    end: "25%,25%"
    duration: 600
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 1200}
- takeScreenshot: ${output.dir}/06_r0c0_x15y25_1
- swipe:
    start: "25%,25%"
