# Bug de Bryan: mantener pulsado un boton de camara deberia seguir moviendo.
#
# Cada prueba es captura - gesto - captura, y el par se compara con
#   python herramientas/comparar.py <antes> <despues>
# (dif media y desplazamiento en px del centro del mapa).
#   05_a: toque corto en la flecha derecha      -> hoy la camara NO se mueve
#   05_b: mantener la flecha derecha 2 s         -> se mueve de forma continua
#   05_c: mantener 2 s con 20 px de deriva       -> tambien se mueve
#   05_d: mantener + (zoom) 2 s                  -> hoy un solo paso, al soltar
#   05_e: mantener - (zoom) 2 s                  -> igual
#   05_f: mantener girar 2 s                     -> hoy un solo giro de 45 grados
# Esperado tras el arreglo: 05_a da un paso; 05_d/e/f cambian durante el
# gesto de forma continua (con autorrepeticion), no solo una vez.
# "Mantener" se hace con swipe de inicio = fin y duracion 2000 ms, que es un
# toque sostenido real (ACTION_DOWN ... ACTION_UP a los 2 s).
appId: com.bryankey.tormentaimperial.qa
name: 05 Mantener pulsada la cruceta y el zoom
tags: [camara, controles]
---
- runFlow: comun/en_partida.yaml
# Primero se aleja la camara del borde con la flecha izquierda.
- swipe:
    start: "3%,83%"
    end: "3%,83%"
    duration: 800
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 1500}
- takeScreenshot: ${output.dir}/05_a0_antes_toque
- tapOn:
    point: "12%,83%"      # flecha derecha, toque corto
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 1500}
- takeScreenshot: ${output.dir}/05_a1_tras_toque
- swipe:
    start: "12%,83%"
    end: "12%,83%"
    duration: 2000
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 1500}
- takeScreenshot: ${output.dir}/05_b1_tras_mantener_2s
- swipe:
    start: "11%,82%"
    end: "12%,84%"        # ~20 px de deriva, como un dedo real
    duration: 2000
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 1500}
- takeScreenshot: ${output.dir}/05_c1_tras_mantener_con_deriva
# Zoom +
- swipe:
    start: "92%,84%"
    end: "92%,84%"
    duration: 2000
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 1500}
- takeScreenshot: ${output.dir}/05_d1_tras_mantener_zoom_mas
# Zoom -
- swipe:
    start: "96%,84%"
    end: "96%,84%"
    duration: 2000
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 1500}
- takeScreenshot: ${output.dir}/05_e1_tras_mantener_zoom_menos
- swipe:
    start: "96%,84%"
    end: "96%,84%"
    duration: 2000
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 1500}
- takeScreenshot: ${output.dir}/05_e2_tras_mantener_zoom_menos_otra
# Girar
- swipe:
    start: "96%,76%"
    end: "96%,76%"
    duration: 2000
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 1500}
- takeScreenshot: ${output.dir}/05_f1_tras_mantener_girar
# longPressOn de Maestro, por comparar con el swipe sostenido.
- longPressOn:
    point: "3%,83%"
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 1500}
- takeScreenshot: ${output.dir}/05_g1_tras_longpress_izquierda
