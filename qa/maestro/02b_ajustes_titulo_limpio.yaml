# Bug de Bryan: "no me deja ajustar nada, todo esta pegado sin accion".
#
# Lo primero que hace un jugador nuevo: abrir AJUSTES en el menu de titulo antes
# de empezar. Con la app recien instalada (clearState), AJUSTES abre el panel y
# ENCIMA aparece la introduccion (1/10). A partir de ahi nada responde: ni los
# sliders, ni Saltar, ni Siguiente, ni la X. La app queda bloqueada hasta
# matarla (y el "atras" de Android la cierra).
# Esperado tras el arreglo: 02b_a muestra AJUSTES sin la introduccion encima y
# los valores cambian en _b.._e; o, si la introduccion aparece, sus botones
# funcionan (02b_h ya no esta en 1/10).
appId: com.bryankey.tormentaimperial.qa
name: 02b Ajustes desde el titulo en instalacion limpia
tags: [ajustes, menus, bloqueo]
---
- runFlow: comun/arrancar.yaml
- takeScreenshot: ${output.dir}/02b_00_titulo
- tapOn:
    point: "18%,46%"      # AJUSTES (sin partida guardada es el 2o boton)
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 2000}
- runFlow:
    file: comun/probar_ajustes.yaml
    env: {P: 02b}
- tapOn:
    point: "27%,81%"      # Saltar de la introduccion
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 1200}
- tapOn:
    point: "72%,81%"      # Siguiente
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 1200}
- tapOn:
    point: "77%,19%"      # X de la introduccion
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 1500}
- takeScreenshot: ${output.dir}/02b_h_tras_saltar_siguiente_x
