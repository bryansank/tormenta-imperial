# Con el panel AJUSTES abierto (pestana Audio): toca y arrastra sliders, toca un
# interruptor, cambia de pestana y cierra. Recibe P (prefijo de las capturas).
# Coordenadas (base 2a3ec3e, tableta 2560x1600 a pantalla completa):
#   Volumen general: pista y=33%, x de 25% a 75%
#   Interruptor Musica: 73%,42%   Musica (volumen): y=54%   Efectos: y=66%
#   Pestana Interfaz: 34%,21%     Cerrar X: 74%,13%
appId: com.bryankey.tormentaimperial.qa
---
# El panel se abre en la ultima pestana usada: primero, Audio.
- tapOn:
    point: "27%,21%"      # pestana Audio
- runFlow:
    file: esperar.yaml
    env: {MS: 800}
- takeScreenshot: ${output.dir}/${P}_a_abierto
# Toque sobre la pista del volumen general, al 25% de su recorrido.
- tapOn:
    point: "37%,33%"
- runFlow:
    file: esperar.yaml
    env: {MS: 800}
- takeScreenshot: ${output.dir}/${P}_b_toque_pista_general
# Arrastre horizontal del tirador (de ~25% a ~75%).
- swipe:
    start: "37%,33%"
    end: "62%,33%"
    duration: 1200
- runFlow:
    file: esperar.yaml
    env: {MS: 800}
- takeScreenshot: ${output.dir}/${P}_c_arrastre_general
# Arrastre "de dedo real": horizontal con algo de deriva vertical, en Efectos.
- swipe:
    start: "65%,66%"
    end: "45%,69%"
    duration: 1000
- runFlow:
    file: esperar.yaml
    env: {MS: 800}
- takeScreenshot: ${output.dir}/${P}_d_arrastre_con_deriva_efectos
# Interruptor de la musica.
- tapOn:
    point: "73%,42%"
- runFlow:
    file: esperar.yaml
    env: {MS: 800}
- takeScreenshot: ${output.dir}/${P}_e_interruptor_musica
# Otra pestana.
- tapOn:
    point: "34%,21%"      # Interfaz
- runFlow:
    file: esperar.yaml
    env: {MS: 800}
- takeScreenshot: ${output.dir}/${P}_f_pestana_interfaz
- tapOn:
    point: "74%,13%"      # X
- runFlow:
    file: esperar.yaml
    env: {MS: 1200}
- takeScreenshot: ${output.dir}/${P}_g_cerrado
