# Bug de Bryan: "cuando ya entro a jugar, no me deja salir al menu principal".
#
# Desde #31 hay un solo menu: "☰ MENÚ" arriba a la derecha (sin II ni columna ☰).
# a) Camino feliz: MENÚ -> Menu principal. Esperado: menu de titulo con
#    Continuar (03_02). Continuar vuelve a la partida (03_03).
# b) Con una ventana abierta: tocar el Nucleo abre su panel de informacion y
#    luego MENÚ. Esperado: el menu se abre (cerrando antes el panel), 03_05.
# c) El MENÚ tiene "Menu principal" (03_06); se cierra con su X.
# d) Boton atras de Android en partida: esperado, abre el MENÚ (03_07) y otro
#    atras lo cierra (03_08). Antes cerraba la app.
appId: com.bryankey.tormentaimperial.qa
name: 03 Salir al menu principal
tags: [menus, pausa]
---
- runFlow: comun/en_partida.yaml
- takeScreenshot: ${output.dir}/03_00_en_partida
# a) MENÚ -> Menu principal -> Continuar
- tapOn:
    point: "94%,5%"       # ☰ MENÚ
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 1500}
- takeScreenshot: ${output.dir}/03_01_menu
- tapOn:
    point: "63%,85%"      # Menu principal
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 3000}
- takeScreenshot: ${output.dir}/03_02_menu_titulo
- tapOn:
    point: "21%,29%"      # Continuar (con partida guardada es el 1er boton)
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 4000}
- takeScreenshot: ${output.dir}/03_03_tras_continuar
# b) Panel de edificio abierto + MENÚ
- tapOn:
    point: "62%,45%"      # el Nucleo, en el centro-derecha de la vista inicial
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 1500}
- takeScreenshot: ${output.dir}/03_04_panel_nucleo
- tapOn:
    point: "94%,5%"       # ☰ MENÚ
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 1500}
- takeScreenshot: ${output.dir}/03_05_menu_con_panel_abierto
# c) El MENÚ tiene "Menu principal"; se cierra con la X
- takeScreenshot: ${output.dir}/03_06_menu_con_menu_principal
- tapOn:
    point: "75%,7%"       # X del MENÚ
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 1500}
# d) Atras de Android
- back
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 2000}
- takeScreenshot: ${output.dir}/03_07_tras_back
- back
- runFlow:
    file: comun/esperar.yaml
    env: {MS: 3000}
- takeScreenshot: ${output.dir}/03_08_tras_back_otra_vez
